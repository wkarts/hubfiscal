name: Bootstrap Hub Fiscal Project

on:
  push:
    branches:
      - feat/plataforma-hub-fiscal-completa
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-project.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  expand-project:
    if: github.head_ref == 'feat/plataforma-hub-fiscal-completa' || github.ref_name == 'feat/plataforma-hub-fiscal-completa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/plataforma-hub-fiscal-completa
          fetch-depth: 0

      - name: Expand validated project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive.b64.part* | base64 --decode > /tmp/hubfiscal.tar.gz
          tar -xzf /tmp/hubfiscal.tar.gz -C .
          rm -rf .bootstrap

          # O token interno do Actions não pode criar/alterar workflows.
          # Preserva apenas este bootstrap; os workflows finais serão
          # publicados em seguida pelo conector GitHub autorizado.
          git restore .github/workflows
          git clean -f .github/workflows

      - name: Commit complete monorepository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: implement complete Hub Fiscal platform"
          git push origin HEAD:feat/plataforma-hub-fiscal-completa
