name: Publicar aplicação
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions: { contents: read, packages: write, id-token: write }
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs: { version: '${{ steps.version.outputs.version }}' }
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - run: ./scripts/check-version.sh
  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile.production
            build_args: API_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/hubfiscal-api-base:py3.13-v1
          - image: web
            file: apps/web/Dockerfile.production
            build_args: WEB_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/hubfiscal-web-base:node24-v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.image }}:${{ needs.validate.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.image }}:latest
          cache-from: type=gha,scope=app-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.image }}
