name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip }
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e 'apps/api[dev]'
      - run: ruff check apps/api/src apps/api/tests
      - run: python -m compileall -q apps/api/src
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config >/dev/null
      - run: docker build -f apps/api/Dockerfile -t hubfiscal-api:ci .
      - run: docker build -f apps/web/Dockerfile -t hubfiscal-web:ci .
