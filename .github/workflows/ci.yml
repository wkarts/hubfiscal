name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validar contrato de versão
        run: ./scripts/check-version.sh

      - name: Validar scripts
        run: |
          python3 -m py_compile scripts/set-version.py
          python3 -m compileall -q apps/api/alembic
          bash -n scripts/*.sh
          bash -n deploy/*.sh
          bash -n deploy/cloudpanel/*.sh

      - name: Validar paridade dos Compose de produção
        run: |
          cmp compose.production.yaml deploy/cloudpanel/compose.yaml
          cmp compose.production.yaml deploy/dockge/compose.yaml
          cmp compose.production.yaml deploy/portainer/compose.yaml

      - name: Validar Compose de desenvolvimento
        run: |
          cp .env.example .env
          output="$(docker compose --env-file .env -f compose.yaml config --quiet 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          if [[ -n "$output" ]]; then printf '%s\n' "$output"; echo 'Compose emitiu warning(s).'; exit 1; fi

      - name: Validar Compose CloudPanel
        run: |
          output="$(docker compose \
            --env-file deploy/cloudpanel/.env.example \
            -f deploy/cloudpanel/compose.yaml \
            config --quiet 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          if [[ -n "$output" ]]; then printf '%s\n' "$output"; echo 'Compose emitiu warning(s).'; exit 1; fi

      - name: Validar Compose Dockge
        run: |
          output="$(docker compose \
            --env-file deploy/dockge/.env.example \
            -f deploy/dockge/compose.yaml \
            config --quiet 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          if [[ -n "$output" ]]; then printf '%s\n' "$output"; echo 'Compose emitiu warning(s).'; exit 1; fi

      - name: Validar Compose Portainer
        run: |
          output="$(docker compose \
            --env-file deploy/portainer/.env.example \
            -f deploy/portainer/compose.yaml \
            config --quiet 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          if [[ -n "$output" ]]; then printf '%s\n' "$output"; echo 'Compose emitiu warning(s).'; exit 1; fi

      - name: Smoke test do storage-init
        run: |
          cp deploy/dockge/.env.example /tmp/hubfiscal-storage.env
          sed -i 's|^HUBFISCAL_DATA_ROOT=.*|HUBFISCAL_DATA_ROOT=/tmp/hubfiscal-storage-smoke|' /tmp/hubfiscal-storage.env
          rm -rf /tmp/hubfiscal-storage-smoke
          docker compose \
            --env-file /tmp/hubfiscal-storage.env \
            -f deploy/dockge/compose.yaml \
            run --rm --no-deps hubfiscal-storage-init
          test -d /tmp/hubfiscal-storage-smoke/postgres
          test -d /tmp/hubfiscal-storage-smoke/redis
          test -d /tmp/hubfiscal-storage-smoke/rabbitmq
          test -d /tmp/hubfiscal-storage-smoke/minio
          test -d /tmp/hubfiscal-storage-smoke/celery
          test -d /tmp/hubfiscal-storage-smoke/backups

      - name: Validar empacotamento da release
        run: |
          ./scripts/package.sh /tmp/hubfiscal-release-assets
          test -s /tmp/hubfiscal-release-assets/hubfiscal-$(cat VERSION)-cloudpanel.tar.gz
          test -s /tmp/hubfiscal-release-assets/hubfiscal-$(cat VERSION)-dockge.tar.gz
          test -s /tmp/hubfiscal-release-assets/hubfiscal-$(cat VERSION)-portainer.tar.gz
          (cd /tmp/hubfiscal-release-assets && sha256sum -c SHA256SUMS)

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e 'apps/api[dev]'
      - run: ruff check apps/api/src apps/api/tests apps/api/alembic/versions
      - run: python -m compileall -q apps/api/src apps/api/alembic
      - run: pytest -q

  migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hubfiscal_ci
          POSTGRES_USER: hubfiscal
          POSTGRES_PASSWORD: hubfiscal-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hubfiscal -d hubfiscal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HUBFISCAL_SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-ci-secret-key-1234567890
      HUBFISCAL_ENCRYPTION_KEY: Q2ZsTG1SS0ttZXJ0cmljLWh1YmZpc2NhbC1rZXk9ISE=
      HUBFISCAL_BOOTSTRAP_TOKEN: bootstrap-ci
      DATABASE_URL: postgresql+asyncpg://hubfiscal:hubfiscal-ci@127.0.0.1:5432/hubfiscal_ci
      DATABASE_URL_SYNC: postgresql+psycopg://hubfiscal:hubfiscal-ci@127.0.0.1:5432/hubfiscal_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci-secret
      MINIO_BUCKET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e apps/api
      - name: Aplicar, reverter e reaplicar migrations
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade 0001
          alembic upgrade head
          alembic current

  certificate-vault:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hubfiscal_ci
          POSTGRES_USER: hubfiscal
          POSTGRES_PASSWORD: hubfiscal-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hubfiscal -d hubfiscal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HUBFISCAL_SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-ci-secret-key-1234567890
      HUBFISCAL_ENCRYPTION_KEY: Q2ZsTG1SS0ttZXJ0cmljLWh1YmZpc2NhbC1rZXk9ISE=
      HUBFISCAL_BOOTSTRAP_TOKEN: bootstrap-ci
      DATABASE_URL: postgresql+asyncpg://hubfiscal:hubfiscal-ci@127.0.0.1:5432/hubfiscal_ci
      DATABASE_URL_SYNC: postgresql+psycopg://hubfiscal:hubfiscal-ci@127.0.0.1:5432/hubfiscal_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: hubfiscal
      MINIO_ROOT_PASSWORD: hubfiscal-ci-secret
      MINIO_BUCKET: hubfiscal-documents
      MINIO_REGION: sa-east-1
      MINIO_SECURE: 'false'
      MINIO_SERVER_SIDE_ENCRYPTION: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e apps/api
      - name: Aplicar migrations
        working-directory: apps/api
        run: alembic upgrade head
      - name: Subir MinIO sem KMS
        run: |
          docker run -d --name hubfiscal-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=hubfiscal \
            -e MINIO_ROOT_PASSWORD=hubfiscal-ci-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs hubfiscal-minio-ci
          exit 1
      - name: Reproduzir POST /certificates ponta a ponta
        run: |
          python - <<'PY'
          import asyncio
          import hashlib
          from datetime import UTC, datetime, timedelta

          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives.serialization import pkcs12
          from httpx import ASGITransport, AsyncClient

          from hubfiscal.core.security import decrypt_secret
          from hubfiscal.main import app
          from hubfiscal.services.storage import storage

          PASSWORD = "certificado-ci-123"
          EMAIL = "admin-ci@hubfiscal.example.com"

          def make_pfx() -> bytes:
              key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
              subject = x509.Name([
                  x509.NameAttribute(x509.NameOID.COMMON_NAME, "Hub Fiscal CI"),
                  x509.NameAttribute(x509.NameOID.ORGANIZATION_NAME, "Empresa CI"),
              ])
              now = datetime.now(UTC)
              cert = (
                  x509.CertificateBuilder()
                  .subject_name(subject)
                  .issuer_name(subject)
                  .public_key(key.public_key())
                  .serial_number(x509.random_serial_number())
                  .not_valid_before(now - timedelta(days=1))
                  .not_valid_after(now + timedelta(days=30))
                  .sign(key, hashes.SHA256())
              )
              return pkcs12.serialize_key_and_certificates(
                  b"hubfiscal-ci",
                  key,
                  cert,
                  None,
                  serialization.BestAvailableEncryption(PASSWORD.encode()),
              )

          async def main() -> None:
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url="http://test") as client:
                  response = await client.post(
                      "/api/v1/bootstrap/admin",
                      json={
                          "token": "bootstrap-ci",
                          "name": "Administrador CI",
                          "email": EMAIL,
                          "password": "Admin-CI-123456",
                      },
                  )
                  assert response.status_code == 201, response.text

                  response = await client.post(
                      "/api/v1/auth/login",
                      json={
                          "email": EMAIL,
                          "password": "Admin-CI-123456",
                      },
                  )
                  assert response.status_code == 200, response.text
                  auth = {"Authorization": f"Bearer {response.json()['access_token']}"}

                  response = await client.post(
                      "/api/v1/tenants",
                      headers=auth,
                      json={
                          "name": "Tenant CI",
                          "slug": "tenant-ci",
                          "resource_preset": "complete",
                      },
                  )
                  assert response.status_code == 201, response.text
                  tenant_id = response.json()["id"]
                  tenant_headers = {**auth, "X-Tenant-ID": tenant_id}

                  response = await client.post(
                      "/api/v1/legal-entities",
                      headers=tenant_headers,
                      json={
                          "document": "11222333000181",
                          "legal_name": "Empresa CI Ltda",
                          "lookup_company": False,
                      },
                  )
                  assert response.status_code == 201, response.text
                  legal_entity_id = response.json()["id"]

                  pfx = make_pfx()
                  response = await client.post(
                      "/api/v1/certificates",
                      headers=tenant_headers,
                      data={
                          "name": "Certificado CI",
                          "password": PASSWORD,
                          "legal_entity_id": legal_entity_id,
                      },
                      files={
                          "file": (
                              "certificado-ci.pfx",
                              pfx,
                              "application/x-pkcs12",
                          )
                      },
                  )
                  assert response.status_code == 201, response.text
                  certificate = response.json()
                  fingerprint = hashlib.sha256(pfx).hexdigest()
                  assert certificate["fingerprint_sha256"] == fingerprint
                  assert certificate["legal_entity_id"] == legal_entity_id

                  storage_key = (
                      f"tenant/{tenant_id}/certificates/{fingerprint}.pfx.enc"
                  )
                  encrypted = await storage.get(storage_key)
                  assert encrypted != pfx
                  assert decrypt_secret(encrypted) == pfx

                  response = await client.get(
                      "/api/v1/certificates",
                      headers=tenant_headers,
                  )
                  assert response.status_code == 200, response.text
                  assert len(response.json()) == 1
                  assert response.json()[0]["fingerprint_sha256"] == fingerprint

                  await storage.delete(storage_key)

          asyncio.run(main())
          PY
      - name: Logs MinIO
        if: always()
        run: |
          docker logs hubfiscal-minio-ci || true
          docker rm -f hubfiscal-minio-ci || true

  rabbitmq-celery:
    runs-on: ubuntu-24.04
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: hubfiscal
          RABBITMQ_DEFAULT_PASS: hubfiscal-ci
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      HUBFISCAL_SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-ci-secret-key-1234567890
      HUBFISCAL_ENCRYPTION_KEY: Q2ZsTG1SS0ttZXJ0cmljLWh1YmZpc2NhbC1rZXk9ISE=
      HUBFISCAL_BOOTSTRAP_TOKEN: bootstrap-ci
      DATABASE_URL: postgresql+asyncpg://hubfiscal:hubfiscal-ci@127.0.0.1:5432/hubfiscal_ci
      DATABASE_URL_SYNC: postgresql+psycopg://hubfiscal:hubfiscal-ci@127.0.0.1:5432/hubfiscal_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: amqp://hubfiscal:hubfiscal-ci@127.0.0.1:5672//
      CELERY_RESULT_BACKEND: cache+memory://
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: ci
      MINIO_ROOT_PASSWORD: ci-secret
      MINIO_BUCKET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e apps/api
      - name: Manter worker conectado ao RabbitMQ 4 com quorum queue
        shell: bash
        run: |
          set -euo pipefail
          celery -A hubfiscal.worker.celery_app worker \
            --pool=solo \
            --loglevel=INFO \
            --without-mingle \
            --without-gossip \
            >/tmp/hubfiscal-celery.log 2>&1 &
          pid=$!
          cleanup() {
            kill -TERM "$pid" >/dev/null 2>&1 || true
            wait "$pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sleep 10
          if ! kill -0 "$pid" >/dev/null 2>&1; then
            cat /tmp/hubfiscal-celery.log
            exit 1
          fi
          cat /tmp/hubfiscal-celery.log
          grep -q "Connected to amqp" /tmp/hubfiscal-celery.log
          grep -q "hubfiscal-tasks" /tmp/hubfiscal-celery.log
          curl -fsS -u hubfiscal:hubfiscal-ci \
            http://127.0.0.1:15672/api/queues/%2F/hubfiscal-tasks \
            >/tmp/hubfiscal-queue.json
          python - <<'PY'
          import json
          queue = json.load(open('/tmp/hubfiscal-queue.json', encoding='utf-8'))
          assert queue['name'] == 'hubfiscal-tasks'
          assert queue['type'] == 'quorum', queue
          PY
          if grep -Eq "transient_nonexcl_queues|global_qos|RestartFreqExceeded|Connection to broker lost" /tmp/hubfiscal-celery.log; then
            echo "Celery/RabbitMQ 4 apresentou regressão de QoS, filas transitórias ou reconexão." >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: |
          output="$(docker compose --env-file .env -f compose.yaml config --quiet 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          if [[ -n "$output" ]]; then printf '%s\n' "$output"; echo 'Compose emitiu warning(s).'; exit 1; fi

      - name: Build imagens de desenvolvimento
        run: |
          docker build -f apps/api/Dockerfile -t hubfiscal-api:ci .
          docker build -f apps/web/Dockerfile -t hubfiscal-web:ci .

      - name: Build imagens-base reais
        run: |
          docker build -f docker/base/api-base.Dockerfile -t hubfiscal-api-base:ci .
          docker build -f docker/base/web-base.Dockerfile -t hubfiscal-web-base:ci .

      - name: Build API de produção
        run: |
          docker build \
            -f apps/api/Dockerfile.production \
            --build-arg API_BASE_IMAGE=hubfiscal-api-base:ci \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg BUILD_REF="ci" \
            -t hubfiscal-api:production-ci .

      - name: Build Web de produção
        run: |
          docker build \
            -f apps/web/Dockerfile.production \
            --build-arg WEB_BASE_IMAGE=hubfiscal-web-base:ci \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t hubfiscal-web:production-ci .
