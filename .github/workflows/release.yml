name: Release

on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read
  id-token: write
  attestations: write

concurrency:
  group: hubfiscal-release
  cancel-in-progress: false

jobs:
  metadata:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_needed: ${{ steps.tag.outputs.release_needed }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      build_date: ${{ steps.version.outputs.build_date }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Ler e validar versão
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          commit_sha="$(git rev-parse HEAD)"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          RELEASE_TAG="$tag" ./scripts/check-version.sh --release

      - name: Verificar se a release já existe
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "A tag $TAG já existe; nenhuma nova publicação será feita."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resumo do gatilho
        run: |
          echo "### Avaliação de release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evento: $GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit main: ${{ steps.version.outputs.commit_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publicação necessária: ${{ steps.tag.outputs.release_needed }}" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: metadata
    if: needs.metadata.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validar contrato
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: ./scripts/check-version.sh --release
      - name: Testar backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e 'apps/api[dev]'
          ruff check apps/api/src apps/api/tests
          python -m compileall -q apps/api/src
          pytest -q
      - name: Construir frontend
        working-directory: apps/web
        run: |
          npm install
          npm run build
      - name: Validar Compose sem warnings
        shell: bash
        run: |
          cp .env.example .env
          for spec in \
            ".env|compose.yaml" \
            "deploy/cloudpanel/.env.example|deploy/cloudpanel/compose.yaml" \
            "deploy/dockge/.env.example|deploy/dockge/compose.yaml" \
            "deploy/portainer/.env.example|deploy/portainer/compose.yaml"; do
            env_file="${spec%%|*}"
            compose_file="${spec#*|}"
            output="$(docker compose --env-file "$env_file" -f "$compose_file" config --quiet 2>&1)" || {
              printf '%s\n' "$output"
              exit 1
            }
            if [[ -n "$output" ]]; then
              printf '%s\n' "$output"
              echo "Compose emitiu warning(s): $compose_file" >&2
              exit 1
            fi
          done
      - name: Smoke test do storage-init
        shell: bash
        run: |
          cp deploy/dockge/.env.example /tmp/hubfiscal-storage.env
          sed -i 's|^HUBFISCAL_DATA_ROOT=.*|HUBFISCAL_DATA_ROOT=/tmp/hubfiscal-storage-release|' /tmp/hubfiscal-storage.env
          rm -rf /tmp/hubfiscal-storage-release
          docker compose \
            --env-file /tmp/hubfiscal-storage.env \
            -f deploy/dockge/compose.yaml \
            run --rm --no-deps hubfiscal-storage-init
          for directory in postgres redis rabbitmq minio celery backups; do
            test -d "/tmp/hubfiscal-storage-release/$directory"
          done

  base-images:
    needs: [metadata, test]
    if: needs.metadata.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api-base
            dockerfile: docker/base/api-base.Dockerfile
            tag: py3.13-v1
          - name: web-base
            dockerfile: docker/base/web-base.Dockerfile
            tag: node24-v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da imagem-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.name }}:${{ matrix.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.name }}:buildcache,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

  images:
    needs: [metadata, test, base-images]
    if: needs.metadata.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile.production
            base_arg: API_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/hubfiscal-api-base:py3.13-v1
          - image: web
            dockerfile: apps/web/Dockerfile.production
            base_arg: WEB_BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/hubfiscal-web-base:node24-v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags da imagem
        id: tags
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.image }}
          COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
        run: |
          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"
          short_sha="${COMMIT_SHA:0:12}"
          {
            echo 'value<<EOF'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:sha-$short_sha"
            if [[ "$PRERELEASE" != "true" ]]; then
              echo "$IMAGE:$major.$minor"
              echo "$IMAGE:$major"
              echo "$IMAGE:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build e push multi-arquitetura
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            ${{ matrix.base_arg }}
            APP_VERSION=${{ needs.metadata.outputs.version }}
            BUILD_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_DATE=${{ needs.metadata.outputs.build_date }}
            BUILD_REF=${{ needs.metadata.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hubfiscal-${{ matrix.image }}:buildcache,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

  artifacts:
    needs: [metadata, test]
    if: needs.metadata.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}
          fetch-depth: 0
      - name: Gerar pacote de release
        run: ./scripts/package.sh release-assets
      - name: Publicar artefato intermediário
        uses: actions/upload-artifact@v7
        with:
          name: hubfiscal-${{ needs.metadata.outputs.version }}-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: [metadata, test, base-images, images, artifacts]
    if: needs.metadata.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: hubfiscal-${{ needs.metadata.outputs.version }}-release-assets
          path: release-assets

      - name: Criar tag anotada pelo workflow
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "Hub Fiscal $VERSION"
          git push origin "$TAG"

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        shell: bash
        run: |
          args=(
            "$TAG"
            release-assets/*
            --title "Hub Fiscal $VERSION"
            --generate-notes
            --verify-tag
          )
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          gh release create "${args[@]}"

      - name: Atestar artefatos
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*

      - name: Resumo da release
        run: |
          echo "### Hub Fiscal ${{ needs.metadata.outputs.version }} publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ needs.metadata.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ needs.metadata.outputs.commit_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagens: API e Web para linux/amd64 e linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias estável: latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache de build: GHCR (independente do cache do GitHub Actions)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefatos: source ZIP/TAR.GZ, CloudPanel, Dockge, Portainer, manifesto e SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
