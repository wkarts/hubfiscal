name: Aplicar correções consolidadas de CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/plataforma-hub-fiscal-completa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: feat/plataforma-hub-fiscal-completa
          fetch-depth: 0

      - name: Corrigir frontend, backend e Docker
        shell: bash
        run: |
          set -euo pipefail
          test -f .fixes/apply-ci-fixes || exit 0
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          continuation = ' && ' + chr(92) + '\n'

          for path in (root / 'apps/web/src').rglob('*.vue'):
              content = path.read_text(encoding='utf-8')
              marker = '</script>'
              position = content.find(marker)
              if position >= 0 and position > 0 and content[position - 1] != '\n':
                  content = content[:position] + '\n' + content[position:]
                  path.write_text(content, encoding='utf-8')

          tsconfig_path = root / 'apps/web/tsconfig.node.json'
          tsconfig = json.loads(tsconfig_path.read_text(encoding='utf-8'))
          tsconfig.setdefault('compilerOptions', {})['noEmit'] = True
          tsconfig_path.write_text(
              json.dumps(tsconfig, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          ci_path = root / '.github/workflows/ci.yml'
          ci = ci_path.read_text(encoding='utf-8')
          ci = ci.replace(
              "      - run: pip install --no-build-isolation -e 'apps/api[dev]'",
              "      - run: python -m pip install --upgrade pip setuptools wheel\n"
              "      - run: python -m pip install -e 'apps/api[dev]'",
          )
          ci_path.write_text(ci, encoding='utf-8')

          dockerfile_path = root / 'apps/api/Dockerfile'
          dockerfile = dockerfile_path.read_text(encoding='utf-8')
          dockerfile = dockerfile.replace(
              "RUN pip install --no-cache-dir --no-build-isolation '.[dev]' &&",
              "RUN python -m pip install --no-cache-dir --upgrade pip setuptools wheel"
              + continuation
              + "    python -m pip install --no-cache-dir --no-build-isolation '.[dev]' &&",
          )
          dockerfile_path.write_text(dockerfile, encoding='utf-8')

          production_path = root / 'apps/api/Dockerfile.production'
          production = production_path.read_text(encoding='utf-8')
          production = production.replace(
              "COPY VERSION /app/VERSION\n"
              "RUN pip install --no-cache-dir --no-build-isolation --no-deps . && chmod +x /app/entrypoint.sh\n"
              "ENV",
              "COPY VERSION /app/VERSION\n"
              "USER root\n"
              "RUN python -m pip install --no-cache-dir --upgrade pip setuptools wheel"
              + continuation
              + "    python -m pip install --no-cache-dir --no-build-isolation --no-deps ."
              + continuation
              + "    chmod +x /app/entrypoint.sh && chown -R hubfiscal:hubfiscal /app\n"
              "USER 10001\n"
              "ENV",
          )
          production_path.write_text(production, encoding='utf-8')

          base_path = root / 'docker/base/api-base.Dockerfile'
          base = base_path.read_text(encoding='utf-8')
          base = base.replace(
              "WORKDIR /app\nCOPY apps/api/pyproject.toml",
              "WORKDIR /app\n"
              "RUN python -m pip install --no-cache-dir --upgrade pip setuptools wheel\n"
              "COPY apps/api/pyproject.toml",
          )
          base_path.write_text(base, encoding='utf-8')
          PY

          rm -f .fixes/apply-ci-fixes

      - name: Publicar correções
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stabilize frontend, backend and Docker builds"
          git push origin HEAD:feat/plataforma-hub-fiscal-completa
