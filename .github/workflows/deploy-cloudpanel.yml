name: Deploy CloudPanel

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag da imagem; vazio usa VERSION
        required: false
        type: string
      verify_public_url:
        description: Validar domínio público após o deploy
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: cloudpanel-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment:
      name: cloudpanel-production
    outputs:
      enabled: ${{ steps.config.outputs.enabled }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolver configuração
        id: config
        env:
          DEPLOY_ENABLED: ${{ vars.CLOUDPANEL_DEPLOY_ENABLED }}
          REQUESTED_VERSION: ${{ inputs.image_tag }}
          RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          enabled="false"
          if [[ "${DEPLOY_ENABLED,,}" == "true" ]]; then
            enabled="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && "${RELEASE_CONCLUSION}" != "success" ]]; then
            enabled="false"
            echo "Release não concluída com sucesso; deploy ignorado."
          fi

          version="${REQUESTED_VERSION:-$(tr -d '[:space:]' < VERSION)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag de imagem inválida: $version" >&2
            exit 1
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != "true" ]]; then
            echo "### Deploy CloudPanel ignorado" >> "$GITHUB_STEP_SUMMARY"
            echo "Defina a Variable de ambiente \`CLOUDPANEL_DEPLOY_ENABLED=true\` para ativar." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: cloudpanel-production
      url: https://${{ vars.HUBFISCAL_DOMAIN }}
    env:
      CLOUDPANEL_HOST: ${{ vars.CLOUDPANEL_HOST }}
      CLOUDPANEL_SSH_PORT: ${{ vars.CLOUDPANEL_SSH_PORT || '22' }}
      CLOUDPANEL_SSH_USER: ${{ vars.CLOUDPANEL_SSH_USER }}
      CLOUDPANEL_DEPLOY_PATH: ${{ vars.CLOUDPANEL_DEPLOY_PATH || '/home/cloudpanel/htdocs/hubfiscal' }}
      CLOUDPANEL_DATA_ROOT: ${{ vars.CLOUDPANEL_DATA_ROOT || '/home/cloudpanel/htdocs/hubfiscal-data' }}
      HUBFISCAL_DOMAIN: ${{ vars.HUBFISCAL_DOMAIN }}
      HUBFISCAL_HTTP_PORT: ${{ vars.HUBFISCAL_HTTP_PORT || '8088' }}
      GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE || github.repository_owner }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'hubfiscal' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'hubfiscal' }}
      RABBITMQ_USER: ${{ vars.RABBITMQ_USER || 'hubfiscal' }}
      RABBITMQ_VHOST: ${{ vars.RABBITMQ_VHOST || '/' }}
      MINIO_USER: ${{ vars.MINIO_USER || 'hubfiscal' }}
      MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'hubfiscal-documents' }}
      HUBFISCAL_LOG_LEVEL: ${{ vars.HUBFISCAL_LOG_LEVEL || 'INFO' }}
      HUBFISCAL_ACCESS_TOKEN_MINUTES: ${{ vars.HUBFISCAL_ACCESS_TOKEN_MINUTES || '60' }}
      HUBFISCAL_REFRESH_TOKEN_DAYS: ${{ vars.HUBFISCAL_REFRESH_TOKEN_DAYS || '30' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validar Variables e Secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
          HUBFISCAL_SECRET_KEY: ${{ secrets.HUBFISCAL_SECRET_KEY }}
          HUBFISCAL_ENCRYPTION_KEY: ${{ secrets.HUBFISCAL_ENCRYPTION_KEY }}
          HUBFISCAL_BOOTSTRAP_TOKEN: ${{ secrets.HUBFISCAL_BOOTSTRAP_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
        shell: bash
        run: |
          required=(
            CLOUDPANEL_HOST CLOUDPANEL_SSH_USER HUBFISCAL_DOMAIN
            SSH_PRIVATE_KEY HUBFISCAL_SECRET_KEY HUBFISCAL_ENCRYPTION_KEY
            HUBFISCAL_BOOTSTRAP_TOKEN POSTGRES_PASSWORD RABBITMQ_PASSWORD
            MINIO_PASSWORD
          )
          failed=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Variable/Secret obrigatório ausente: $name" >&2
              failed=1
            fi
          done
          if [[ "${#HUBFISCAL_SECRET_KEY}" -lt 32 ]]; then
            echo "HUBFISCAL_SECRET_KEY deve possuir ao menos 32 caracteres." >&2
            failed=1
          fi
          exit "$failed"

      - name: Gerar ambiente de produção
        env:
          IMAGE_TAG: ${{ needs.preflight.outputs.version }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HUBFISCAL_SECRET_KEY: ${{ secrets.HUBFISCAL_SECRET_KEY }}
          HUBFISCAL_ENCRYPTION_KEY: ${{ secrets.HUBFISCAL_ENCRYPTION_KEY }}
          HUBFISCAL_BOOTSTRAP_TOKEN: ${{ secrets.HUBFISCAL_BOOTSTRAP_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from datetime import UTC, datetime
          from pathlib import Path

          def required(name: str) -> str:
              value = os.environ[name]
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"{name} não pode conter quebra de linha")
              return value

          values = {
              "COMPOSE_PROJECT_NAME": "hubfiscal",
              "GHCR_REGISTRY": "ghcr.io",
              "GHCR_NAMESPACE": required("GHCR_NAMESPACE"),
              "HUBFISCAL_IMAGE_TAG": required("IMAGE_TAG"),
              "HUBFISCAL_BIND_HOST": "127.0.0.1",
              "HUBFISCAL_HTTP_PORT": required("HUBFISCAL_HTTP_PORT"),
              "HUBFISCAL_DOMAIN": required("HUBFISCAL_DOMAIN"),
              "HUBFISCAL_CORS_ORIGINS": f"https://{required('HUBFISCAL_DOMAIN')}",
              "HUBFISCAL_DATA_ROOT": required("CLOUDPANEL_DATA_ROOT"),
              "MINIO_PUBLIC_ENDPOINT": "",
              "HUBFISCAL_ENV": "production",
              "HUBFISCAL_DEBUG": "false",
              "HUBFISCAL_SECRET_KEY": required("HUBFISCAL_SECRET_KEY"),
              "HUBFISCAL_ENCRYPTION_KEY": required("HUBFISCAL_ENCRYPTION_KEY"),
              "HUBFISCAL_BOOTSTRAP_TOKEN": required("HUBFISCAL_BOOTSTRAP_TOKEN"),
              "HUBFISCAL_ACCESS_TOKEN_MINUTES": required("HUBFISCAL_ACCESS_TOKEN_MINUTES"),
              "HUBFISCAL_REFRESH_TOKEN_DAYS": required("HUBFISCAL_REFRESH_TOKEN_DAYS"),
              "HUBFISCAL_LOG_LEVEL": required("HUBFISCAL_LOG_LEVEL"),
              "HUBFISCAL_BUILD_SHA": required("BUILD_SHA"),
              "HUBFISCAL_BUILD_DATE": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "HUBFISCAL_BUILD_REF": f"v{required('IMAGE_TAG')}",
              "POSTGRES_DB": required("POSTGRES_DB"),
              "POSTGRES_USER": required("POSTGRES_USER"),
              "POSTGRES_PASSWORD": required("POSTGRES_PASSWORD"),
              "RABBITMQ_USER": required("RABBITMQ_USER"),
              "RABBITMQ_PASSWORD": required("RABBITMQ_PASSWORD"),
              "RABBITMQ_VHOST": required("RABBITMQ_VHOST"),
              "CELERY_CONCURRENCY": "2",
              "MINIO_USER": required("MINIO_USER"),
              "MINIO_PASSWORD": required("MINIO_PASSWORD"),
              "MINIO_BUCKET": required("MINIO_BUCKET"),
              "MINIO_REGION": "us-east-1",
              "POSTGRES_IMAGE": "postgres:17-alpine",
              "REDIS_IMAGE": "redis:8-alpine",
              "RABBITMQ_IMAGE": "rabbitmq:4-management-alpine",
              "MINIO_IMAGE": "minio/minio:latest",
              "MINIO_MC_IMAGE": "minio/mc:latest",
              "DOCKER_LOG_MAX_SIZE": "10m",
              "DOCKER_LOG_MAX_FILES": "5",
          }

          def dotenv(value: str) -> str:
              escaped = value.replace("\\", "\\\\").replace('"', '\\"').replace("$", "$$")
              return f'"{escaped}"'

          Path(".env.new").write_text(
              "\n".join(f"{key}={dotenv(value)}" for key, value in values.items()) + "\n",
              encoding="utf-8",
          )
          PY
          chmod 600 .env.new
          docker compose --env-file .env.new -f deploy/cloudpanel/compose.yaml config --quiet

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/hubfiscal-cloudpanel
          chmod 600 ~/.ssh/hubfiscal-cloudpanel
          ssh-keyscan -p "$CLOUDPANEL_SSH_PORT" -H "$CLOUDPANEL_HOST" >> ~/.ssh/known_hosts

      - name: Enviar stack ao CloudPanel
        shell: bash
        run: |
          ssh -i ~/.ssh/hubfiscal-cloudpanel -p "$CLOUDPANEL_SSH_PORT" \
            "$CLOUDPANEL_SSH_USER@$CLOUDPANEL_HOST" \
            "mkdir -p '$CLOUDPANEL_DEPLOY_PATH'"
          scp -i ~/.ssh/hubfiscal-cloudpanel -P "$CLOUDPANEL_SSH_PORT" \
            deploy/cloudpanel/compose.yaml \
            deploy/cloudpanel/deploy.sh \
            deploy/cloudpanel/healthcheck.sh \
            .env.new \
            "$CLOUDPANEL_SSH_USER@$CLOUDPANEL_HOST:$CLOUDPANEL_DEPLOY_PATH/"

      - name: Autenticar servidor no GHCR quando necessário
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        shell: bash
        run: |
          if [[ -z "$GHCR_TOKEN" ]]; then
            echo "GHCR_TOKEN ausente; continuando para imagens públicas."
            exit 0
          fi
          username="${GHCR_USERNAME:-${{ github.repository_owner }}}"
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/hubfiscal-cloudpanel \
            -p "$CLOUDPANEL_SSH_PORT" \
            "$CLOUDPANEL_SSH_USER@$CLOUDPANEL_HOST" \
            "docker login ghcr.io --username '$username' --password-stdin"

      - name: Executar deploy com rollback automático
        shell: bash
        run: |
          ssh -i ~/.ssh/hubfiscal-cloudpanel -p "$CLOUDPANEL_SSH_PORT" \
            "$CLOUDPANEL_SSH_USER@$CLOUDPANEL_HOST" \
            "cd '$CLOUDPANEL_DEPLOY_PATH' && chmod 700 deploy.sh healthcheck.sh && ./deploy.sh '$CLOUDPANEL_DEPLOY_PATH'"

      - name: Validar URL pública
        if: github.event_name != 'workflow_dispatch' || inputs.verify_public_url != false
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "https://$HUBFISCAL_DOMAIN/api/v1/health/live"

      - name: Resumo do deploy
        run: |
          echo "### Deploy CloudPanel concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: ${{ needs.preflight.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Domínio: https://$HUBFISCAL_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Servidor: $CLOUDPANEL_HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Diretório: $CLOUDPANEL_DEPLOY_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dados: $CLOUDPANEL_DATA_ROOT" >> "$GITHUB_STEP_SUMMARY"
