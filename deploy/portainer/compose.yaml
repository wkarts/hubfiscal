name: ${COMPOSE_PROJECT_NAME:-hubfiscal}

# Imagens oficiais. Para fork ou registry privado, sobrescreva no .env.
x-api-image: &api-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts}/hubfiscal-api:${APP_IMAGE_TAG:-latest}
x-web-image: &web-image ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-wkarts}/hubfiscal-web:${APP_IMAGE_TAG:-latest}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILES:-5}

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Hub Fiscal}
  TZ: ${APP_TIMEZONE:-America/Bahia}
  HUBFISCAL_ENV: ${HUBFISCAL_ENV:-production}
  HUBFISCAL_DEBUG: ${HUBFISCAL_DEBUG:-false}
  HUBFISCAL_SECRET_KEY: ${HUBFISCAL_SECRET_KEY:?HUBFISCAL_SECRET_KEY obrigatória}
  HUBFISCAL_ENCRYPTION_KEY: ${HUBFISCAL_ENCRYPTION_KEY:?HUBFISCAL_ENCRYPTION_KEY obrigatória}
  HUBFISCAL_BOOTSTRAP_TOKEN: ${HUBFISCAL_BOOTSTRAP_TOKEN:?HUBFISCAL_BOOTSTRAP_TOKEN obrigatória}
  HUBFISCAL_ACCESS_TOKEN_MINUTES: ${HUBFISCAL_ACCESS_TOKEN_MINUTES:-60}
  HUBFISCAL_REFRESH_TOKEN_DAYS: ${HUBFISCAL_REFRESH_TOKEN_DAYS:-30}
  HUBFISCAL_CORS_ORIGINS: ${HUBFISCAL_CORS_ORIGINS:?HUBFISCAL_CORS_ORIGINS obrigatória}
  HUBFISCAL_LOG_LEVEL: ${HUBFISCAL_LOG_LEVEL:-INFO}
  POSTGRES_HOST: hubfiscal-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-hubfiscal}
  POSTGRES_USER: ${POSTGRES_USER:-hubfiscal}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
  REDIS_HOST: hubfiscal-redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  CELERY_RESULT_REDIS_DB: "1"
  RABBITMQ_HOST: hubfiscal-rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-hubfiscal}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  MINIO_ENDPOINT: http://hubfiscal-minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-hubfiscal-documents}
  MINIO_REGION: ${MINIO_REGION:-sa-east-1}
  MINIO_ROOT_USER: ${MINIO_USER:-hubfiscal}
  MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD obrigatória}
  MINIO_SECURE: "false"

x-app-common: &app-common
  image: *api-image
  pull_policy: always
  restart: unless-stopped
  environment: *api-environment
  networks:
    - hubfiscal-network
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 45s
  labels:
    io.hubfiscal.instance: ${INSTANCE_NAME:-default}
    io.hubfiscal.image-tag: ${APP_IMAGE_TAG:-latest}

services:
  hubfiscal-storage-init:
    image: ${STORAGE_INIT_IMAGE:-alpine:3.22}
    restart: "no"
    user: "0:0"
    volumes:
      - ${HUBFISCAL_DATA_ROOT:-./hubfiscal-data}:/data
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/postgres /data/redis /data/rabbitmq /data/minio /data/celery /data/backups
        chmod 0755 /data
        chmod 0777 /data/postgres /data/redis /data/rabbitmq /data/minio /data/backups
        chown -R ${API_RUNTIME_UID:-10001}:${API_RUNTIME_GID:-10001} /data/celery
        chmod 0770 /data/celery
    networks:
      - hubfiscal-network
    logging: *default-logging

  hubfiscal-postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    depends_on:
      hubfiscal-storage-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubfiscal}
      POSTGRES_USER: ${POSTGRES_USER:-hubfiscal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatória}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${APP_TIMEZONE:-America/Bahia}
    volumes:
      - ${HUBFISCAL_DATA_ROOT:-./hubfiscal-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - hubfiscal-network
    logging: *default-logging
    stop_grace_period: 60s

  hubfiscal-redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    depends_on:
      hubfiscal-storage-init:
        condition: service_completed_successfully
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${HUBFISCAL_DATA_ROOT:-./hubfiscal-data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hubfiscal-network
    logging: *default-logging

  hubfiscal-rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management-alpine}
    restart: unless-stopped
    depends_on:
      hubfiscal-storage-init:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hubfiscal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD obrigatória}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      TZ: ${APP_TIMEZONE:-America/Bahia}
    volumes:
      - ${HUBFISCAL_DATA_ROOT:-./hubfiscal-data}/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - hubfiscal-network
    logging: *default-logging

  hubfiscal-minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    depends_on:
      hubfiscal-storage-init:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-hubfiscal}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD obrigatória}
      MINIO_REGION_NAME: ${MINIO_REGION:-sa-east-1}
      TZ: ${APP_TIMEZONE:-America/Bahia}
    volumes:
      - ${HUBFISCAL_DATA_ROOT:-./hubfiscal-data}/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - hubfiscal-network
    logging: *default-logging

  hubfiscal-minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      hubfiscal-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-hubfiscal}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?MINIO_PASSWORD obrigatória}
      MINIO_BUCKET: ${MINIO_BUCKET:-hubfiscal-documents}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://hubfiscal-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    networks:
      - hubfiscal-network
    logging: *default-logging

  hubfiscal-migrate:
    <<: *app-common
    restart: "no"
    command: ["migrate"]
    depends_on:
      hubfiscal-postgres:
        condition: service_healthy
      hubfiscal-redis:
        condition: service_healthy
      hubfiscal-rabbitmq:
        condition: service_healthy

  hubfiscal-api:
    <<: *app-common
    command: ["api"]
    depends_on:
      hubfiscal-migrate:
        condition: service_completed_successfully
      hubfiscal-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    tmpfs:
      - /tmp:size=256m,mode=1777

  hubfiscal-worker:
    <<: *app-common
    command: ["worker"]
    depends_on:
      hubfiscal-api:
        condition: service_healthy
    environment:
      <<: *api-environment
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    tmpfs:
      - /tmp:size=512m,mode=1777

  hubfiscal-beat:
    <<: *app-common
    command: ["beat"]
    depends_on:
      hubfiscal-api:
        condition: service_healthy
    volumes:
      - ${HUBFISCAL_DATA_ROOT:-./hubfiscal-data}/celery:/tmp/celery

  hubfiscal-web:
    image: *web-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      hubfiscal-api:
        condition: service_healthy
    ports:
      - ${WEB_BIND_HOST:-127.0.0.1}:${WEB_PUBLISHED_PORT:-58088}:80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hubfiscal-network
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    labels:
      io.hubfiscal.instance: ${INSTANCE_NAME:-default}
      io.hubfiscal.image-tag: ${APP_IMAGE_TAG:-latest}

networks:
  hubfiscal-network:
    name: ${RESOURCE_PREFIX:-hubfiscal}_network
    driver: bridge
