[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hubfiscal-api"
version = "0.2.4"
description = "API da plataforma Hub Fiscal"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pyjwt[crypto]>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "cryptography>=45,<47",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "boto3>=1.39,<2",
  "redis>=6.2,<7",
  "celery>=5.5,<6",
  "lxml>=6,<7",
  "defusedxml>=0.7,<1",
  "structlog>=25.4,<26",
  "prometheus-fastapi-instrumentator>=7.1,<8",
  "orjson>=3.11,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E701", "E702", "F401"]
